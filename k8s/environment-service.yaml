apiVersion: apps/v1
kind: Deployment
metadata:
  name: environment-service
  labels:
    app: environment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: environment-service
  template:
    metadata:
      labels:
        app: environment-service
    spec:
      containers:
        - name: environment-service
          image: uav-flight-optimizer/environment-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: environment-service
spec:
  selector:
    app: environment-service
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
